input_path: data/derived/master_table.parquet
split_path: data/derived/split_v1.parquet
views_output_dir: data/derived/views
views_config_path: data/derived/views/views_config.json
test_size: 0.2
random_state: 42
include_entry_load: false
aid_sources: [federal, institutional, private, other, state]
entry_load_columns:
  - SUMMER_FULL_TIME
  - SUMMER_PART_TIME
  - FALL_FULL_TIME
  - FALL_PART_TIME
cohorts:
  ftic:
    type: B
    num: [Entry_Age, Entry_HS_GPA, ACT_TOTAL, Credits_Transfered_Max]
    cat: [COHORT_YEAR, CIP2]
  transfer:
    type: A
    num: [Entry_Age, Credits_Transfered_Max, AA_AS]
    cat: [COHORT_YEAR, CIP2]
views:
  ftic_ret1:
    cohort: ftic
    outcome: RETAINED_YR1
    aid_years: [1]
    require: []
  ftic_ret2:
    cohort: ftic
    outcome: RETAINED_YR2
    aid_years: [1, 2]
    require: [RETAINED_YR1]
  ftic_ret3:
    cohort: ftic
    outcome: RETAINED_YR3
    aid_years: [1, 2, 3]
    require: [RETAINED_YR1, RETAINED_YR2]

  ftic_grad3:
    cohort: ftic
    outcome: "Graduated Count Yr 3"
    aid_years: [1]
    require: []
  ftic_grad4:
    cohort: ftic
    outcome: "Graduated Count Yr 4"
    aid_years: [1]
    require: []
  tr_ret1:
    cohort: transfer
    outcome: RETAINED_YR1
    aid_years: [1]
    require: []
  tr_ret2:
    cohort: transfer
    outcome: RETAINED_YR2
    aid_years: [1, 2]
    require: [RETAINED_YR1]
  tr_grad3:
    cohort: transfer
    outcome: "Graduated Count Yr 3"
    aid_years: [1]
    require: []

# Impact (treatment-effect) views: one full-sample file per cohort x treatment
# year x aid source. RETAINED_YRk means the student came back for year k + 1.
# Year-k population: students enrolled in year k who received some aid that
# year; controls are recipients who did not receive that source. Covariates
# are measured before year-k aid: entry characteristics, earlier-year term
# history, and earlier-year aid.
impact_output_dir: data/derived/impact_views
impact_config_path: data/derived/impact_views/impact_views_config.json
impact_history_metrics: [end_ucf_gpa, credits_enrolled, credits_earned]
impact_cohorts:
  ftic:
    type: B
    num: [Entry_Age, Entry_HS_GPA, SAT_TOTAL, ACT_TOTAL, Credits_Transfered]
    cat: [COHORT_YEAR, CIP2]
    outcomes:  # by treatment year; only outcomes measured after that year's aid
      1:
        - RETAINED_YR1
        - RETAINED_THRU_YR2
        - RETAINED_THRU_YR3
        - "Graduated Count Yr 3"
        - "Graduated Count Yr 4"
      2:
        - RETAINED_YR2
        - RETAINED_THRU_YR3
        - "Graduated Count Yr 3"
        - "Graduated Count Yr 4"
      3:
        - RETAINED_YR3
        - "Graduated Count Yr 3"
        - "Graduated Count Yr 4"
  transfer:
    type: A
    num: [Entry_Age, Credits_Transfered, AA_AS]
    cat: [COHORT_YEAR, CIP2]
    outcomes:
      1:
        - RETAINED_YR1
        - RETAINED_THRU_YR2
        - "Graduated Count Yr 3"
      2:
        - RETAINED_YR2
        - "Graduated Count Yr 3"
      3:
        - "Graduated Count Yr 3"
